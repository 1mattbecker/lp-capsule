# Score the exp2 models on the four test sets, at LP's best and the last
# checkpoint. Baselines (exp1_all_ft, exp1_all_seed1, ...) are in exp1's eval.
#   uv run scripts/launch.py batch experiments/bottomcam_exp2/eval.yaml \
#       --out runs/exp2/eval --max-concurrent 12
defaults:
  predict:
    labeled_frames:
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/test/test_ephys_id.csv
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/test/test_ephys_ood.csv
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/test/test_fip_id.csv
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/test/test_fip_ood.csv
runs:
  - {name: eval_exp2_ft_seed1_last, model: exp2_ft_seed1, checkpoint: last}
  - {name: eval_exp2_ft_seed1_best, model: exp2_ft_seed1, checkpoint: best}
  - {name: eval_exp2_ft_semi_last, model: exp2_ft_semi, checkpoint: last}
  - {name: eval_exp2_ft_semi_best, model: exp2_ft_semi, checkpoint: best}
