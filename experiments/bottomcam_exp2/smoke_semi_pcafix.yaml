# Step 1c of exp2, rerun after the PCA fix (code/lp_fixes.py, pca_frame_coords).
# The first smoke run (smoke_semi.yaml) drifted: val RMSE 1.4 -> 2.0 px by
# epoch 20, 14 px after unfreezing, raw PCA loss 13-20 px on a good model.
# Same recipe. Pass: raw PCA loss about 2 px at the start, and val RMSE
# tracks exp1_all_ft (about 1.2 px to epoch 20, 0.9-1.0 after). g6.2xlarge.
#   uv run scripts/launch.py batch experiments/bottomcam_exp2/smoke_semi_pcafix.yaml \
#       --out runs/exp2/smoke_pcafix --max-concurrent 1
runs:
  - name: exp2_smoke_ft_semi_pcafix
    task: train
    project:
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/train
      - pylon2test2_r01_labels/pylon2test2_r01_labels
      - p2t2_clean/p2t2_clean
    base_config: ephys_BottomCamera_Pylon2Test2
    init_checkpoint: ephys_BottomCamera_Pylon2Test2
    csv_file: train_all.csv
    overrides:
      model: {losses_to_use: [pca_singleview, temporal]}
      training:
        max_epochs: 40
        min_epochs: 40
        ckpt_every_n_epochs: 40
        lr_scheduler_params: {multisteplr: {milestones: [40]}}   # no LR step in 40 epochs
        optimizer_params: {learning_rate: 1.0e-4}
        rng_seed_data_pt: 0
        rng_seed_model_pt: 0
