# exp2 step 3: each addition alone on exp1_all_ft's recipe (fine-tune
# Pylon2Test2 on all frames, 100 epochs, lr 1e-4, seed 0). g6.2xlarge (L4):
# semi peaks at 15.7 GiB, ctx at 21.8 GiB from scratch.
# - ft_semi: Pylon2Test2's losses with the PCA fix (lp_fixes.pca_frame_coords;
#   smoke_semi_pcafix.yaml passed).
# - ft_ctx: context model; Pylon2Test2's head fills the single-frame head,
#   the multi-frame head starts fresh (train.bridge_state).
#   uv run scripts/launch.py batch experiments/bottomcam_exp2/train_l4.yaml \
#       --out runs/exp2/train --max-concurrent 12
defaults:
  train:
    project:
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/train
      - pylon2test2_r01_labels/pylon2test2_r01_labels
      - p2t2_clean/p2t2_clean
    base_config: ephys_BottomCamera_Pylon2Test2
    init_checkpoint: ephys_BottomCamera_Pylon2Test2
    csv_file: train_all.csv
    overrides:
      model: {losses_to_use: []}
      training:
        max_epochs: 100
        min_epochs: 100
        ckpt_every_n_epochs: 25
        lr_scheduler_params: {multisteplr: {milestones: [50, 67, 83]}}
        optimizer_params: {learning_rate: 1.0e-4}
        rng_seed_data_pt: 0
        rng_seed_model_pt: 0
runs:
  - name: exp2_ft_semi
    overrides:
      model: {losses_to_use: [pca_singleview, temporal]}
  - name: exp2_ft_ctx
    overrides:
      model: {model_type: heatmap_mhcrnn}
