# Bottom-camera training experiment: does FIP data hurt ephys accuracy (and
# the reverse), do the context model and the semi-supervised losses help, and
# does fine-tuning Pylon2Test2 match training from scratch.
#   uv run scripts/launch.py batch experiments/bottomcam_exp1/train.yaml \
#       --out runs/exp1/train --max-concurrent 4
# Data: bottomcam_exp1 (build_data.py; train/ CSVs, FIP labeled-data and
# unlabeled FIP clips), round-1 labeled-data, Pylon2Test2's labeled-data and
# ephys clips, merged into one project. Held-out mice and test frames are in
# no train CSV. Every run keeps LP's best checkpoint and every-n-epochs ones,
# so best and last are both scored (eval.yaml).
defaults:
  train:
    project:
      - labeleddata_bottomcam_exp1/bottomcam_exp1/train
      - pylon2test2_r01_labels/pylon2test2_r01_labels
      - ephys_BottomCamera_Pylon2Test2
    base_config: ephys_BottomCamera_Pylon2Test2   # resnet50_animal_ap10k heatmap, 384x384
    csv_file: train_all.csv
    overrides:
      model:
        losses_to_use: []         # supervised; run all_semi turns Pylon2Test2's losses on
      training:
        max_epochs: 300           # milestones 150/200/250, lr 1e-3: the base config's
        min_epochs: 300
        ckpt_every_n_epochs: 50   # keeps epoch=299 (last) besides LP's best
        rng_seed_data_pt: 0
        rng_seed_model_pt: 0
runs:
  - name: exp1_all          # p2t2 + r01 + fip, the reference
  - name: exp1_ephys        # p2t2 + r01: does adding FIP hurt ephys?
    csv_file: train_ephys.csv
  - name: exp1_fip          # fip only: does adding ephys hurt FIP?
    csv_file: train_fip.csv
  - name: exp1_all_ctx      # context model (t-2..t+2 = +-4 ms at 500 Hz)
    context_frames_from_videos: true   # Pylon2Test2's frames lack neighbours
    overrides:
      model: {model_type: heatmap_mhcrnn}
  - name: exp1_all_semi     # Pylon2Test2's unsupervised losses, ephys + FIP clips
    overrides:
      model: {losses_to_use: [pca_singleview, temporal]}
  - name: exp1_all_ft       # fine-tune Pylon2Test2 on all frames (r01b's settings)
    init_checkpoint: ephys_BottomCamera_Pylon2Test2
    overrides: &finetune
      training:
        max_epochs: 100
        min_epochs: 100
        ckpt_every_n_epochs: 25
        lr_scheduler_params: {multisteplr: {milestones: [50, 67, 83]}}
        optimizer_params: {learning_rate: 1.0e-4}
  - name: exp1_ephys_ft     # control for all_ft: same fine-tune without FIP
    csv_file: train_ephys.csv
    init_checkpoint: ephys_BottomCamera_Pylon2Test2
    overrides: *finetune
  - name: exp1_all_seed1    # exp1_all again with other seeds: run-to-run noise
    overrides:
      training: {rng_seed_data_pt: 1, rng_seed_model_pt: 1}
