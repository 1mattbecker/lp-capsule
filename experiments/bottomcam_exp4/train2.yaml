# exp4 round 2. vitb_sam and vitb_sam2 diverged at lr 1e-3 soon after the
# backbone unfroze (best epochs 59 and 24; their last checkpoints predict NaN),
# so rerun them at lr 1e-4. resnet101 beat ResNet-50 from scratch but not the
# fine-tuned Pylon2Test2 on FIP OOD; resnet101_ft gives it the same second
# stage exp1_all_ft had (100 epochs at lr 1e-4 from its own last checkpoint).
#   uv run scripts/launch.py batch experiments/bottomcam_exp4/train2.yaml \
#       --out runs/exp4/train2 --max-concurrent 3
defaults:
  train:
    project:
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/train
      - pylon2test2_r01_labels/pylon2test2_r01_labels
      - p2t2_clean/p2t2_clean
    base_config: ephys_BottomCamera_Pylon2Test2   # heatmap, 384x384
    csv_file: train_all.csv
    overrides:
      model: {losses_to_use: []}
      training:
        max_epochs: 300
        min_epochs: 300
        ckpt_every_n_epochs: 50
        rng_seed_data_pt: 0
        rng_seed_model_pt: 0
runs:
  - name: exp4_vitb_sam_lr1e-4
    overrides:
      model: {backbone: vitb_sam}
      training: {optimizer_params: {learning_rate: 1.0e-4}}
  - name: exp4_vitb_sam2_lr1e-4
    overrides:
      model: {backbone: vitb_sam2}
      training: {optimizer_params: {learning_rate: 1.0e-4}}
  - name: exp4_resnet101_ft
    init_checkpoint: exp4_resnet101
    overrides:
      model: {backbone: resnet101}
      training:
        max_epochs: 100
        min_epochs: 100
        ckpt_every_n_epochs: 25
        lr_scheduler_params: {multisteplr: {milestones: [50, 67, 83]}}
        optimizer_params: {learning_rate: 1.0e-4}
