# exp4 smoke: do LP 2.4.3's larger backbones load their pretrained weights in
# the capsule, train on our data, and what do they peak at on the GPU? 5 epochs
# of exp1_all's from-scratch recipe with the backbone unfrozen from epoch 1, so
# the peak includes backbone gradients. g6e.xlarge (L40S, 48 GB).
#   uv run scripts/launch.py batch experiments/bottomcam_exp4/smoke.yaml \
#       --out runs/exp4/smoke --max-concurrent 4
defaults:
  train:
    project:
      - labeleddata_bottomcam_exp1/bottomcam_exp1/upload/bottomcam_exp1/train
      - pylon2test2_r01_labels/pylon2test2_r01_labels
      - p2t2_clean/p2t2_clean
    base_config: ephys_BottomCamera_Pylon2Test2   # heatmap, 384x384
    csv_file: train_all.csv
    overrides:
      model: {losses_to_use: []}
      training:
        max_epochs: 5
        min_epochs: 5
        unfreezing_epoch: 1
        ckpt_every_n_epochs: 5
        lr_scheduler_params: {multisteplr: {milestones: [5]}}
        rng_seed_data_pt: 0
        rng_seed_model_pt: 0
runs:
  - name: exp4_smoke_vitb_dinov2
    overrides: {model: {backbone: vitb_dinov2}}
  - name: exp4_smoke_vitb_sam
    overrides: {model: {backbone: vitb_sam}}
  - name: exp4_smoke_vitb_sam2
    overrides: {model: {backbone: vitb_sam2}}
  - name: exp4_smoke_resnet101
    overrides: {model: {backbone: resnet101}}
