callbacks:
  anneal_weight:
    attr_name: total_unsupervised_importance
    final_val: 1.0
    freeze_until_epoch: 0
    increase_factor: 0.01
    init_val: 0.0
dali:
  base:
    predict:
      sequence_length: 96
    train:
      sequence_length: 32
  context:
    predict:
      sequence_length: 96
    train:
      batch_size: 16
  general:
    seed: 123456
data:
  columns_for_singleview_pca:
  - 0
  - 1
  - 9
  - 10
  csv_file: /results/CollectedData.masked.csv
  data_dir: /results
  downsample_factor: 2
  image_resize_dims:
    height: 384
    width: 384
  keypoint_names: null
  mirrored_column_matches: null
  num_keypoints: 11
  video_dir: /results/videos/
eval:
  colormap: cool
  confidence_thresh_for_vid: 0.9
  fiftyone:
    address: 127.0.0.1
    dataset_name: test
    launch_app_from_script: false
    model_display_names:
    - test_model
    port: 5151
    remote: true
  hydra_paths:
  - ' '
  predict_vids_after_training: true
  save_vids_after_training: false
  test_videos_directory: /results/videos/
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
losses:
  pca_multiview:
    components_to_keep: 3
    epsilon: null
    log_weight: 5.0
  pca_singleview:
    components_to_keep: 0.99
    epsilon: null
    log_weight: 5.0
  temporal:
    epsilon: 20.0
    log_weight: 5.0
    prob_threshold: 0.05
model:
  backbone: resnet50_animal_ap10k
  checkpoint: null
  heatmap_loss_type: mse
  losses_to_use:
  - pca_singleview
  - temporal
  model_name: test
  model_type: heatmap
training:
  check_val_every_n_epoch: 5
  ckpt_every_n_epochs: null
  early_stop_patience: 3
  early_stopping: false
  imgaug: dlc
  log_every_n_steps: 10
  lr_scheduler: multisteplr
  lr_scheduler_params:
    multisteplr:
      gamma: 0.5
      milestones:
      - 150
      - 200
      - 250
  max_epochs: 300
  min_epochs: 300
  num_gpus: 1
  num_workers: 4
  rng_seed_data_pt: 0
  rng_seed_model_pt: 0
  test_batch_size: 32
  train_batch_size: 16
  train_frames: 1
  train_prob: 0.95
  unfreezing_epoch: 20
  uniform_heatmaps_for_nan_keypoints: true
  val_batch_size: 32
  val_prob: 0.05
